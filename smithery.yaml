# Smithery configuration file: https://smithery.ai/docs/build/project-config

startCommand:
  type: stdio
  commandFunction:
    # A JS function that produces the CLI command based on the given config to start the MCP on stdio.
    |-
    (config) => ({ command: 'node', args: [ 'dist/index.js', ...(config.notesPath ? [config.notesPath] : []) ], env: {} })
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    type: object
    required: []
    properties:
      notesPath:
        type: string
        default: ""
        description: Path to notes directory. If omitted, uses ~/Documents/Notes by default.
    description: Configuration for MCP Notes server
  exampleConfig: {}
